<div class="container">

  <div class="form-card">

    <!-- ✅ MOVE HEADING HERE -->
    <h2>Create Student</h2>

    <form (ngSubmit)="saveStudent()">

      <div>
        <label>Roll Number</label>
        <input type="number" [(ngModel)]="student.RollNumber" name="RollNumber" required>
      </div>

      <div>
        <label>Student Name</label>
        <input type="text" [(ngModel)]="student.StudentName" name="StudentName" required>
      </div>

      <div>
        <label>Semester</label>
        <input type="number" [(ngModel)]="student.Semester" name="Semester" required>
      </div>

      <div>
        <label>Class</label>
        <input type="text" [(ngModel)]="student.Class" name="Class">
      </div>

      <div>
        <label>Address</label>
        <input type="text" [(ngModel)]="student.Address" name="Address">
      </div>

      <div>
        <label>Joining Date</label>
        <input type="date" [(ngModel)]="student.JoiningDate" name="JoiningDate">
      </div>

      <button type="submit">Save Student</button>

    </form>

  </div>

</div>
